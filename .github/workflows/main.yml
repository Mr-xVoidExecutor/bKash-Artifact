name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create missing apktool.yml and Build APK
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool

        # যদি apktool.yml ফাইলটি না থাকে, তবে একটি বেসিক কনফিগারেশন ফাইল তৈরি করে নেওয়া
        if [ ! -f "apktool.yml" ]; then
          echo "version: 2.7.0" > apktool.yml
          echo "apkFileName: bKash.apk" >> apktool.yml
          echo "isFrameworkApk: false" >> apktool.yml
          echo "sdkInfo:" >> apktool.yml
          echo "  minSdkVersion: '24'" >> apktool.yml
          echo "  targetSdkVersion: '34'" >> apktool.yml
        fi

        # এবার apktool দিয়ে বিল্ড করা
        apktool b . -o bKash-unsigned.apk

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bKash-Unsigned-APK
        path: bKash-unsigned.apk
