name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Apktool and Build APK
      run: |
        # Apktool ডাউনলোড এবং ইনস্টল করা
        sudo apt-get update
        sudo apt-get install -y apktool

        # বর্তমান ফোল্ডারের সোর্স দিয়ে APK বিল্ড করা
        apktool b . -o bKash-unsigned.apk

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bKash-Unsigned-APK
        path: bKash-unsigned.apk
